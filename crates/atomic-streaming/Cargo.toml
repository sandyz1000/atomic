[package]
name = "atomic-streaming"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait = { workspace = true }
tokio = { workspace = true, features = ["full"] }

# randomness
rand = { workspace = true }
# serialization
rkyv = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rayon = { workspace = true }
petgraph = { workspace = true }
bit-set = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
atomic-compute = { workspace = true }
atomic-data = { workspace = true }
uuid = { workspace = true }
num_cpus = { workspace = true }

# Optional Kafka source (KafkaInputDStream). Off by default — enabling it pulls in
# librdkafka (built from source via cmake). Build with `--features kafka`.
rdkafka = { workspace = true, optional = true, features = ["cmake-build"] }

[features]
default = []
# Enables `StreamingContext::kafka_stream` + `KafkaInputDStream` +
# `StreamingContext::direct_kafka_stream` + `DirectKafkaInputDStream`. Also forwards
# `atomic-compute/kafka` — the worker's `NativeDispatcher` needs its `KafkaConsume`
# dispatch arm compiled in to handle the `EngineAction::KafkaConsume` ops this crate emits
# (direct_kafka_stream), or the match becomes non-exhaustive.
kafka = ["dep:rdkafka", "atomic-data/kafka", "atomic-compute/kafka"]

[dev-dependencies]
tempfile = { workspace = true }

[lib]
name = "atomic_streaming"
path = "src/lib.rs"
doctest = false
